<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Radio Player</title>
    <!-- Include HLS.js library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Outer wrapper to stack title and card vertically */
        .player-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 95vw;
            max-width: 500px;
        }

        /* Title positioned lower with added top margin */
        .external-title {
            color: #222222;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 24px;     /* Push title down */
            margin-bottom: 16px;  /* Spacing before card view */
            text-align: center;
            user-select: none;
        }

        /* Player card container with smooth color transition */
        .player-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;          
            box-sizing: border-box;
            padding: 12px 24px;   
            border-radius: 50px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            gap: 20px;
            background: linear-gradient(135deg, hsl(280, 75%, 60%), hsl(320, 80%, 50%));
            transition: background 0.15s linear; /* Smooth real-time color blending */
        }

        .play-button {
            cursor: pointer;
            transition: transform 0.2s ease;
            display: block;
            flex-shrink: 0;
        }
        .play-button:hover {
            transform: scale(1.05);
        }
        .play-button:active {
            transform: scale(0.95);
        }

        /* Volume Controls */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            justify-content: flex-end;
        }

        /* Volume slider styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <!-- Title positioned lower -->
        <h2 class="external-title">Online radio</h2>

        <!-- Card View Container -->
        <div class="player-container" id="player-card">
            <!-- Play / Pause Button -->
            <svg id="play" class="play-button" xml:space="preserve" viewBox="0 0 100 100" width="60px" height="60px">
                <g class="ldl-scale" style="transform-origin:50% 50%;">
                    <circle stroke="#ffffff" stroke-width="8" fill="rgba(255,255,255,0.2)" stroke-miterlimit="10" r="37" cy="50" cx="50"></circle>
                    
                    <!-- Play Icon Path -->
                    <path id="icon-play" fill="#ffffff" d="M73.265 51.254l-35.594 20.55A1.447 1.447 0 0 1 35.5 70.55v-41.1a1.448 1.448 0 0 1 2.171-1.254l35.594 20.55c.965.558.965 1.95 0 2.508z"></path>
                    
                    <!-- Pause Icon Path -->
                    <g id="icon-pause" style="display: none;">
                        <path fill="#ffffff" d="M45.39 70H34.841c-.666 0-1.205-.54-1.205-1.205v-37.59c0-.666.54-1.205 1.205-1.205H45.39c.666 0 1.205.54 1.205 1.205v37.59c0 .665-.54 1.205-1.205 1.205z"></path>
                        <path fill="#ffffff" d="M65.159 70H54.61c-.666 0-1.205-.54-1.205-1.205v-37.59c0-.666.54-1.205 1.205-1.205h10.549c.666 0 1.205.54 1.205 1.205v37.59c0 .665-.54 1.205-1.205 1.205z"></path>
                    </g>
                </g>
            </svg>

            <!-- Volume Control Slider -->
            <div class="volume-container">
                <svg width="28px" height="28px" viewBox="0 0 24 24" fill="#ffffff" style="flex-shrink: 0;">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
            </div>
        </div>
    </div>

    <script>
        const FILE = "https://air.pc.cdn.bitgravity.com/air/live/pbaudio210/playlist.m3u8";
        
        const playBtn = document.getElementById('play');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const volumeSlider = document.getElementById('volume-slider');
        const playerCard = document.getElementById('player-card');
        
        const audio = new Audio();
        audio.crossOrigin = "anonymous"; // Required for Web Audio API analysis
        let hls;

        // Web Audio API setup
        let audioCtx, analyser, dataArray, animationId;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64; // Small size for fast frequency analysis
                
                const source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);

                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
        }

        // Color sync animation loop
        function syncColorToRhythm() {
            if (audio.paused) return;

            analyser.getByteFrequencyData(dataArray);

            // Get average energy levels across frequencies
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let averageEnergy = sum / dataArray.length; // Range: 0 to 255

            // Map audio energy to dynamic HSL colors
            let baseHue = (averageEnergy * 2.5 + Date.now() * 0.02) % 360; // Shifts hue with bass/treble and time
            let lightness = 45 + (averageEnergy / 255) * 20;               // Brightens on loud beats/rhythm
            let secondHue = (baseHue + 50) % 360;                           // Smooth gradient pairing

            playerCard.style.background = `linear-gradient(135deg, hsl(${baseHue}, 80%, ${lightness}%), hsl(${secondHue}, 85%, 45%))`;

            animationId = requestAnimationFrame(syncColorToRhythm);
        }

        audio.volume = volumeSlider.value;

        if (Hls.isSupported()) {
            hls = new Hls({
                liveSyncDurationCount: 3,
                liveMaxLatencyDurationCount: 10,
                enableWorker: true
            });
            hls.loadSource(FILE);
            hls.attachMedia(audio);
        } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
            audio.src = FILE;
        }

        playBtn.addEventListener('click', function() {
            initAudioContext();

            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (audio.paused) {
                if (hls && hls.liveSyncPosition) {
                    audio.currentTime = hls.liveSyncPosition;
                }
                audio.play().catch(e => console.log("Playback prevented:", e));
            } else {
                audio.pause();
            }
        });

        audio.addEventListener('play', function() {
            iconPlay.style.display = 'none';
            iconPause.style.display = 'inline';
            syncColorToRhythm(); // Start syncing colors to music rhythm
        });

        audio.addEventListener('pause', function() {
            iconPause.style.display = 'none';
            iconPlay.style.display = 'inline';
            cancelAnimationFrame(animationId); // Stop animation loop on pause
        });

        volumeSlider.addEventListener('input', function(e) {
            audio.volume = e.target.value;
        });
    </script>

</body>
</html>
